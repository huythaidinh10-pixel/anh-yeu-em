<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Cậu - Lời Yêu Thương</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #fff;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.15);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            max-width: 400px;
            width: 90%;
        }
        h1 {
            font-size: 26px;
            margin-bottom: 20px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn {
            background: #fff;
            color: #ff4b6e;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: 0.3s;
        }
        .btn:hover {
            background: #ffe6eb;
            transform: scale(1.05);
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container" id="welcome-screen">
        <h1>Hi Cậu! 💌</h1>
        <p>Tớ có một món quà nhỏ muốn gửi riêng cho cậu...</p>
        <button class="btn" onclick="openLetter()">Mở thư ra nha ✨</button>
    </div>

    <div class="container hidden" id="letter-screen">
        <h1>Real Love ❤️</h1>
        <p id="typed-text"></p>
        <button class="btn" onclick="location.reload()">Quay lại từ đầu</button>
    </div>

    <!-- Nhạc nền Real Love (Dùng link stream nhạc trực tiếp) -->
    <audio id="bg-music" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
        Trình duyệt của bạn không hỗ trợ thẻ audio.
    </audio>

    <script>
        function openLetter() {
            // Ẩn màn hình chào, hiện màn hình thư
            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('letter-screen').classList.remove('hidden');

            // Phát nhạc nền
            var music = document.getElementById('bg-music');
            music.play().catch(error => {
                console.log("Trình duyệt chặn tự động phát nhạc:", error);
            });

            // Hiệu ứng chữ chạy (Typing effect)
            var text = "Cảm ơn cậu đã xuất hiện và mang lại ý nghĩa thực sự cho cuộc sống của tớ. Giống như giai điệu bài hát này, gặp được cậu chính là điều tuyệt vời nhất! ❤️";
            var i = 0;
            function typeWriter() {
                if (i < text.length) {
                    document.getElementById("typed-text").innerHTML += text.charAt(i);
                    i++;
                    setTimeout(typeWriter, 50);
                }
            }
            typeWriter();
        }
    </script>
</body>
</html>
